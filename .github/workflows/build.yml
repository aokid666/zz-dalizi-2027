name: Build and publish Dalizi question bank
on:
  push:
    branches: [main]
    paths: ['pdf/**', 'tools/**', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dalizi-publish
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aokid666/zhengzhi-720
          path: .site-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Extract, validate, match and render original PNG pages
        run: python tools/build.py --site .site-source --render
      - name: Persist generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data img
          if ! git diff --cached --quiet; then
            git commit -m "Build 2015–2025 questions and original lossless page images"
            git push origin HEAD:main
          fi
      - name: Assemble Pages files
        run: |
          mkdir -p _site
          cp -a pdf img data index.html .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
